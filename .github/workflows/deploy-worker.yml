name: Deploy Cloudflare Worker

# Manual only (2026-11-12). The worker config moved to .github/worker/wrangler.toml so
# the public site no longer serves it, and the old CLOUDFLARE_API_TOKEN secret was a
# revoked token: every push failed this job. Add a new token secret before running it.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: quick visibility when debugging
      - name: Sanity check (masked)
        run: |
          echo "Account (if provided): ${CLOUDFLARE_ACCOUNT_ID:-<none>}"

      - name: Install Wrangler (v4)
        run: |
          npm i -g wrangler@4
          wrangler --version

      - name: Wrangler whoami (CLI)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler whoami

      - name: Deploy via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler deploy --config .github/worker/wrangler.toml

      - name: Set GROQ_API_KEY secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.GROQ_API_KEY }}" | wrangler secret put GROQ_API_KEY --config .github/worker/wrangler.toml
